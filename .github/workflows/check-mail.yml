name: Check Mail

on:
  schedule:
    - cron: '*/10 * * * *'    # 10분마다 실행
  workflow_dispatch:           # 수동 실행 버튼

permissions:
  contents: write              # last_seen_id.txt 변경분 커밋용

concurrency:
  group: check-mail
  cancel-in-progress: false    # 동시 실행 방지 (10분 안에 안 끝나면 다음 trigger 무시)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore Google credentials from secrets
        env:
          CRED: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TOK:  ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$CRED" > credentials.json
          printf '%s' "$TOK"  > token.json

      - name: Check & notify + handle bot commands
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit state if changed
        run: |
          git add last_seen_id.txt senders.txt watching.txt blocked_senders.txt telegram_offset.txt quota.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update state [skip ci]"
            git push
          fi
